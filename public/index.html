<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>File Explorer C++</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://compiler-cpp-production.up.railway.app/codemirror/lib/codemirror.js"></script>
    <script src="https://compiler-cpp-production.up.railway.app/codemirror/mode/clike/clike.js"></script>
    <script src="https://compiler-cpp-production.up.railway.app/codemirror/addon/comment/comment.js"></script>
    <link
      rel="stylesheet"
      href="https://compiler-cpp-production.up.railway.app/codemirror/theme/monokai.css"
    />
    <link
      rel="stylesheet"
      href="https://compiler-cpp-production.up.railway.app/codemirror/theme/eclipse.css"
    />
    <link
      rel="stylesheet"
      href="https://compiler-cpp-production.up.railway.app/codemirror/lib/codemirror.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Loader -->
    <div class="loader-parent">
      <div class="loader-container">
        <div class="loader"></div>
        <div class="title">Opening in editor, please wait...</div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
      <span id="toast-message"></span>
    </div>

    <!-- App Container -->
    <div class="app-container">
      <header>
        <a class="logo" href="/">
          <i class="fas fa-folder-tree"></i>
          <span>File Explorer C++</span>
        </a>
        <div class="search-container">
          <input
            type="text"
            id="search-input"
            placeholder="Search files or folders... "
            autocomplete="off"
            spellcheck="false"
            aria-label="Search files or folders"
          />
          <button id="search-button" class="action-btn">
            <i class="fas fa-search"></i>
          </button>
          <button
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Toggle theme"
            style="margin: 0 5px 0 20px"
          >
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </header>
      <div class="container">
        <div class="search-con">
          <div id="breadcrumb" class="breadcrumb">
            <i class="fas fa-home"></i> <span> Home</span>
          </div>
          <div class="search-container">
            <a class="breadcrumb" href="./Lab_Manual.pdf" target="_blank">
              <i class="fa-solid fa-book"></i>
              <span>Lab Manual</span>
            </a>
          </div>
        </div>
        <div class="empty-folder"></div>
        <div id="file-list"></div>
      </div>

      <footer>
        <p>File Explorer C++ &copy; 2025 | Made by Abhishek</p>
      </footer>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
